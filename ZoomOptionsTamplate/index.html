<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./style.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
  </head>
  <body>
    <div class="tool-container">
      <div class="child child-1"><i class="bi bi-mic"></i>Audio</div>
      <div class="child child-2">
        <i class="bi bi-camera-video-off"></i>Video
      </div>
      <div class="child child-3">
        <i class="bi bi-people-fill"></i>Participants
      </div>
      <div class="child child-4"><i class="bi bi-chat-dots"></i>Chat</div>
      <div class="child child-5"><i class="bi bi-heart"></i>React</div>
      <div class="child child-6">
        <i class="bi bi-arrow-up-square-fill"></i>Share
      </div>
      <div class="child child-7"><i class="bi bi-pause-fill"></i>Pause</div>
      <div class="child child-8"><i class="bi bi-person-square"></i>Layout</div>
      <div class="child child-9"><i class="bi bi-pencil"></i>Annotate</div>
      <div class="child child-10">
        <i class="bi bi-square-fill"></i>Show Metting
      </div>
      <div class="child child-11"><i class="bi bi-chat-dots"></i>More</div>
    </div>

    <div class="share-container">
      <div class="share-screen">
        <i class="bi bi-arrow-return-left"></i> Your are Sharing Screen<i
          class="bi bi-mic"
        ></i
        ><i class="bi bi-shield-fill-check"></i>
      </div>
      <div class="stop-share"><input type="checkbox" />Stop Share</div>
    </div>
  </body>
</html>
